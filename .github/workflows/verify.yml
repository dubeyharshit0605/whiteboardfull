name: Verify whiteboard
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            whiteboard-tutorial/package-lock.json
      - run: npm ci --prefix whiteboard-tutorial
      - run: npm run build --prefix whiteboard-tutorial
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
